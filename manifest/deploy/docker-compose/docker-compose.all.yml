services:
  # -------------------------------------------------------------
  # 1. 基础中间件集群 (Infrastructure)
  # -------------------------------------------------------------
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: go-zero-nacos
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
    ports:
      - "8848:8848"
      - "9848:9848"
    networks:
      - go-zero-net

  etcd:
    image: bitnami/etcd:3.5
    container_name: go-zero-etcd
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    ports:
      - "2379:2379"
      - "2380:2380"
    networks:
      - go-zero-net

  redis:
    image: redis:7-alpine
    container_name: go-zero-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - go-zero-net

  mysql:
    image: mysql:8.0
    container_name: go-zero-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: go_zero_boilerplate
    ports:
      - "3306:3306"
    volumes:
      - ../../sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - go-zero-net

  casdoor:
    image: casbin/casdoor:latest
    container_name: go-zero-casdoor
    environment:
      RUNNING_IN_DOCKER: "true"
      driverName: "mysql"
      dataSourceName: "root:root@tcp(mysql:3306)/"
      dbName: "casdoor"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - go-zero-net

  # -------------------------------------------------------------
  # 2. 内部微服务集群 (Internal gRPC Services)
  # -------------------------------------------------------------
  user-rpc:
    build:
      context: ../../../
      dockerfile: app/user/rpc/Dockerfile
    container_name: go-zero-user-rpc
    environment:
      USER_RPC_LISTEN_ON: "0.0.0.0:8080"
      MYSQL_DSN: "root:root@tcp(mysql:3306)/go_zero_boilerplate?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai"
      REDIS_HOST: "redis:6379"
      NACOS_HOST: "nacos"
      NACOS_PORT: 8848
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    networks:
      - go-zero-net

  order-rpc:
    build:
      context: ../../../
      dockerfile: app/order/rpc/Dockerfile
    container_name: go-zero-order-rpc
    environment:
      ORDER_RPC_LISTEN_ON: "0.0.0.0:8081"
      MYSQL_DSN: "root:root@tcp(mysql:3306)/go_zero_boilerplate?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai"
      REDIS_HOST: "redis:6379"
      NACOS_HOST: "nacos"
      NACOS_PORT: 8848
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    networks:
      - go-zero-net

  # -------------------------------------------------------------
  # 3. 统一接入网关 (HTTP Gateway / BFF)
  # -------------------------------------------------------------
  gateway:
    build:
      context: ../../../
      dockerfile: app/gateway/Dockerfile
    container_name: go-zero-gateway
    environment:
      NACOS_HOST: "nacos"
      NACOS_PORT: 8848
      USER_RPC_HOST: "user-rpc:8080"
      ORDER_RPC_HOST: "order-rpc:8081"
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: 8888
    ports:
      - "8888:8888"
    depends_on:
      - user-rpc
      - order-rpc
    networks:
      - go-zero-net

  # -------------------------------------------------------------
  # 4. 前端多端静态托管与反向代理 (Nginx: Portal + Admin)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ../../../
      dockerfile: frontend/Dockerfile
    container_name: go-zero-frontend
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      - gateway
    networks:
      - go-zero-net

networks:
  go-zero-net:
    driver: bridge
