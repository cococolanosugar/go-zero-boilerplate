<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Go-Zero Monorepo - Ant Design Pro 管理后台</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      .admin-shell-skeleton {
        display: flex;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }
      .admin-shell-sider {
        width: 220px;
        background: #001529;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }
      .admin-shell-sider-logo {
        height: 56px;
        margin: 16px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 6px;
      }
      .admin-shell-sider-menu {
        flex: 1;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .admin-shell-sider-item {
        height: 38px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 6px;
      }
      .admin-shell-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .admin-shell-header {
        height: 56px;
        background: #fff;
        border-bottom: 1px solid #f0f0f0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
      }
      .admin-shell-header-left {
        width: 160px;
        height: 20px;
        background: #f0f0f0;
        border-radius: 4px;
      }
      .admin-shell-header-right {
        display: flex;
        gap: 12px;
      }
      .admin-shell-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #f0f0f0;
      }
      .admin-shell-content {
        flex: 1;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .admin-shell-card {
        background: #fff;
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      }
      .admin-shell-title {
        width: 240px;
        height: 28px;
        background: #f0f0f0;
        border-radius: 4px;
        margin-bottom: 20px;
      }
      .admin-shell-line {
        height: 16px;
        background: #f7f7f7;
        border-radius: 4px;
        margin-bottom: 12px;
      }
      .pulse-anim {
        animation: admin-pulse 1.5s ease-in-out infinite;
      }
      @keyframes admin-pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="admin-shell-skeleton pulse-anim">
        <aside class="admin-shell-sider">
          <div class="admin-shell-sider-logo"></div>
          <div class="admin-shell-sider-menu">
            <div class="admin-shell-sider-item"></div>
            <div class="admin-shell-sider-item"></div>
            <div class="admin-shell-sider-item"></div>
            <div class="admin-shell-sider-item"></div>
            <div class="admin-shell-sider-item"></div>
          </div>
        </aside>
        <div class="admin-shell-main">
          <header class="admin-shell-header">
            <div class="admin-shell-header-left"></div>
            <div class="admin-shell-header-right">
              <div class="admin-shell-avatar"></div>
            </div>
          </header>
          <main class="admin-shell-content">
            <div class="admin-shell-card">
              <div class="admin-shell-title"></div>
              <div class="admin-shell-line" style="width: 80%;"></div>
              <div class="admin-shell-line" style="width: 60%;"></div>
            </div>
            <div class="admin-shell-card" style="flex: 1;">
              <div class="admin-shell-line" style="width: 100%;"></div>
              <div class="admin-shell-line" style="width: 95%;"></div>
              <div class="admin-shell-line" style="width: 90%;"></div>
              <div class="admin-shell-line" style="width: 70%;"></div>
            </div>
          </main>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
