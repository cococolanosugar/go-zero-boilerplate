syntax = "proto3";

package titan;
option go_package = "./titan";

message CommonResp {
  int64 code = 1;
  string msg = 2;
}

message PingReq {
  string ping = 1;
}

message PingResp {
  string pong = 1;
}

// ----------------------
// 1. 集成凭证 (Integration)
// ----------------------
message IntegrationItem {
  int64 id = 1;
  string name = 2;
  string category = 3;
  string authType = 4;
  string config = 5; // 安全过滤后的配置 JSON
  int32 status = 6;
  string description = 7;
  int64 createdBy = 8;
  string createTime = 9;
  string updateTime = 10;
}

message ListIntegrationsReq {
  string category = 1;
  int32 page = 2;
  int32 pageSize = 3;
}

message ListIntegrationsResp {
  int64 total = 1;
  repeated IntegrationItem list = 2;
}

message CreateIntegrationReq {
  string name = 1;
  string category = 2;
  string authType = 3;
  string config = 4; // 原始配置 JSON（由服务端加密存储）
  string description = 5;
  int64 createdBy = 6;
}

message CreateIntegrationResp {
  int64 id = 1;
}

message UpdateIntegrationReq {
  int64 id = 1;
  string name = 2;
  string authType = 3;
  string config = 4;
  int32 status = 5;
  string description = 6;
}

message DeleteIntegrationReq {
  int64 id = 1;
}

message TestIntegrationReq {
  int64 id = 1;
}

message TestIntegrationResp {
  bool success = 1;
  string message = 2;
}

// ----------------------
// 2. Kubernetes 集群 (Cluster)
// ----------------------
message ClusterItem {
  int64 id = 1;
  string name = 2;
  string env = 3;
  string apiEndpoint = 4;
  string status = 5;
  string version = 6;
  string description = 7;
  int64 createdBy = 8;
  string createTime = 9;
  string updateTime = 10;
}

message ListClustersReq {
  string env = 1;
  int32 page = 2;
  int32 pageSize = 3;
}

message ListClustersResp {
  int64 total = 1;
  repeated ClusterItem list = 2;
}

message CreateClusterReq {
  string name = 1;
  string env = 2;
  string apiEndpoint = 3;
  string kubeconfig = 4; // Kubeconfig 文本
  string description = 5;
  int64 createdBy = 6;
}

message CreateClusterResp {
  int64 id = 1;
}

message UpdateClusterReq {
  int64 id = 1;
  string name = 2;
  string env = 3;
  string apiEndpoint = 4;
  string kubeconfig = 5;
  string description = 6;
}

message DeleteClusterReq {
  int64 id = 1;
}

message TestClusterReq {
  int64 id = 1;
}

message TestClusterResp {
  bool success = 1;
  string version = 2;
  string message = 3;
}

message ListNamespacesReq {
  int64 clusterId = 1;
}

message ListNamespacesResp {
  repeated string namespaces = 1;
}

// ----------------------
// 3. 流水线定义 (Pipeline)
// ----------------------
message PipelineItem {
  int64 id = 1;
  string name = 2;
  string displayName = 3;
  string category = 4;
  string gitRepo = 5;
  string gitBranch = 6;
  string stages = 7; // JSON DSL
  string params = 8; // JSON
  string triggers = 9; // JSON
  int32 status = 10;
  string description = 11;
  int64 createdBy = 12;
  string createTime = 13;
  string updateTime = 14;
}

message ListPipelinesReq {
  string category = 1;
  string keyword = 2;
  int32 page = 3;
  int32 pageSize = 4;
}

message ListPipelinesResp {
  int64 total = 1;
  repeated PipelineItem list = 2;
}

message GetPipelineReq {
  int64 id = 1;
}

message PipelineDetailResp {
  PipelineItem pipeline = 1;
}

message CreatePipelineReq {
  string name = 1;
  string displayName = 2;
  string category = 3;
  string gitRepo = 4;
  string gitBranch = 5;
  string stages = 6;
  string params = 7;
  string triggers = 8;
  string description = 9;
  int64 createdBy = 10;
}

message CreatePipelineResp {
  int64 id = 1;
}

message UpdatePipelineReq {
  int64 id = 1;
  string displayName = 2;
  string category = 3;
  string gitRepo = 4;
  string gitBranch = 5;
  string stages = 6;
  string params = 7;
  string triggers = 8;
  int32 status = 9;
  string description = 10;
}

message DeletePipelineReq {
  int64 id = 1;
}

// ----------------------
// 4. 执行实例 (Execution)
// ----------------------
message TriggerPipelineReq {
  int64 pipelineId = 1;
  string triggerType = 2; // MANUAL / WEBHOOK
  int64 triggerBy = 3;
  string gitBranch = 4;
  string gitCommit = 5;
  string runtimeParams = 6; // JSON key-value
}

message TriggerPipelineResp {
  int64 execId = 1;
  string execNo = 2;
}

message ExecutionItem {
  int64 id = 1;
  int64 pipelineId = 2;
  string pipelineName = 3;
  string execNo = 4;
  string triggerType = 5;
  int64 triggerBy = 6;
  string gitBranch = 7;
  string gitCommit = 8;
  string runtimeParams = 9;
  string status = 10;
  string workflowId = 11;
  string startTime = 12;
  string endTime = 13;
  int64 durationMs = 14;
  string artifacts = 15;
  string createTime = 16;
}

message StepExecItem {
  int64 id = 1;
  int64 execId = 2;
  string stageId = 3;
  string stepId = 4;
  string stepName = 5;
  string stepType = 6;
  string status = 7;
  string logPath = 8;
  string errorMsg = 9;
  string startTime = 10;
  string endTime = 11;
  int64 durationMs = 12;
}

message ListExecutionsReq {
  int64 pipelineId = 1;
  string status = 2;
  int32 page = 3;
  int32 pageSize = 4;
}

message ListExecutionsResp {
  int64 total = 1;
  repeated ExecutionItem list = 2;
}

message GetExecutionDetailReq {
  int64 execId = 1;
}

message ExecutionDetailResp {
  ExecutionItem execution = 1;
  repeated StepExecItem steps = 2;
}

message GetStepLogReq {
  int64 stepExecId = 1;
  int64 offset = 2;
}

message GetStepLogResp {
  string content = 1;
  int64 nextOffset = 2;
  bool isEnd = 3;
}

message ApproveStepReq {
  int64 stepExecId = 1;
  int64 userId = 2;
  bool approved = 3;
  string comment = 4;
}

message CancelExecutionReq {
  int64 execId = 1;
  int64 userId = 2;
}

// ----------------------
// 5. 项目 (Project)
// ----------------------
message ProjectItem {
  int64 id = 1;
  string name = 2;
  string displayName = 3;
  string description = 4;
  int64 ownerId = 5;
  int32 status = 6;
  int32 appCount = 7;
  int32 envCount = 8;
  string createTime = 9;
  string updateTime = 10;
}

message ListProjectsReq {
  int32 page = 1;
  int32 pageSize = 2;
  string keyword = 3;
}

message ListProjectsResp {
  int64 total = 1;
  repeated ProjectItem list = 2;
}

message GetProjectReq {
  int64 id = 1;
}

message ProjectDetailResp {
  ProjectItem project = 1;
}

message CreateProjectReq {
  string name = 1;
  string displayName = 2;
  string description = 3;
  int64 ownerId = 4;
}

message CreateProjectResp {
  int64 id = 1;
}

message UpdateProjectReq {
  int64 id = 1;
  string displayName = 2;
  string description = 3;
  int64 ownerId = 4;
  int32 status = 5;
}

message DeleteProjectReq {
  int64 id = 1;
}

// ----------------------
// 6. 应用 (Application)
// ----------------------
message AppItem {
  int64 id = 1;
  int64 projectId = 2;
  string name = 3;
  string displayName = 4;
  string description = 5;
  int64 integrationId = 6;
  string repoUrl = 7;
  string defaultBranch = 8;
  string buildConfig = 9;
  string deploySpec = 10;
  int32 status = 11;
  string createTime = 12;
  string updateTime = 13;
}

message ListAppsReq {
  int64 projectId = 1;
  int32 page = 2;
  int32 pageSize = 3;
}

message ListAppsResp {
  int64 total = 1;
  repeated AppItem list = 2;
}

message GetAppReq {
  int64 id = 1;
}

message AppDetailResp {
  AppItem app = 1;
}

message CreateAppReq {
  int64 projectId = 1;
  string name = 2;
  string displayName = 3;
  string description = 4;
  int64 integrationId = 5;
  string repoUrl = 6;
  string defaultBranch = 7;
  string buildConfig = 8;
  string deploySpec = 9;
}

message CreateAppResp {
  int64 id = 1;
}

message UpdateAppReq {
  int64 id = 1;
  string displayName = 2;
  string description = 3;
  int64 integrationId = 4;
  string repoUrl = 5;
  string defaultBranch = 6;
  string buildConfig = 7;
  string deploySpec = 8;
  int32 status = 9;
  string name = 10;
}

message DeleteAppReq {
  int64 id = 1;
}

// ----------------------
// 7. 环境 (Environment)
// ----------------------
message EnvItem {
  int64 id = 1;
  int64 projectId = 2;
  string envCode = 3;
  string name = 4;
  int64 clusterId = 5;
  string clusterName = 6;
  string namespace = 7;
  string status = 8;
  int32 appCount = 9;
  string createTime = 10;
  string updateTime = 11;
}

message ListEnvsReq {
  int64 projectId = 1;
}

message ListEnvsResp {
  repeated EnvItem list = 1;
}

message GetEnvReq {
  int64 id = 1;
}

message EnvDetailResp {
  EnvItem env = 1;
}

message CreateEnvReq {
  int64 projectId = 1;
  string envCode = 2;
  string name = 3;
  int64 clusterId = 4;
  string namespace = 5;
}

message CreateEnvResp {
  int64 id = 1;
}

message UpdateEnvReq {
  int64 id = 1;
  string name = 2;
  int64 clusterId = 3;
  string namespace = 4;
  string status = 5;
}

message DeleteEnvReq {
  int64 id = 1;
}

message EnvAppLiveItem {
  int64 appId = 1;
  string appName = 2;
  string displayName = 3;
  int64 currentArtifactId = 4;
  string imageTag = 5;
  string imageUrl = 6;
  string gitCommit = 7;
  int32 readyReplicas = 8;
  int32 totalReplicas = 9;
  string status = 10;
  string lastDeployedTime = 11;
  repeated string pods = 12;
}

message GetEnvLiveDetailReq {
  int64 envId = 1;
}

message GetEnvLiveDetailResp {
  int64 envId = 1;
  string envCode = 2;
  string envName = 3;
  string clusterName = 4;
  string namespace = 5;
  repeated EnvAppLiveItem apps = 6;
}

// ----------------------
// 8. 制品库 (Artifact)
// ----------------------
message ArtifactItem {
  int64 id = 1;
  int64 projectId = 2;
  int64 appId = 3;
  string appName = 4;
  string imageUrl = 5;
  string imageTag = 6;
  string imageDigest = 7;
  string gitBranch = 8;
  string gitCommit = 9;
  string commitMsg = 10;
  int64 buildExecId = 11;
  int64 imageSizeBytes = 12;
  string status = 13;
  string createTime = 14;
}

message ListArtifactsReq {
  int64 projectId = 1;
  int64 appId = 2;
  int32 page = 3;
  int32 pageSize = 4;
}

message ListArtifactsResp {
  int64 total = 1;
  repeated ArtifactItem list = 2;
}

message CreateArtifactReq {
  int64 projectId = 1;
  int64 appId = 2;
  string imageUrl = 3;
  string imageTag = 4;
  string imageDigest = 5;
  string gitBranch = 6;
  string gitCommit = 7;
  string commitMsg = 8;
  int64 buildExecId = 9;
  int64 imageSizeBytes = 10;
}

message CreateArtifactResp {
  int64 id = 1;
}

message DeployArtifactReq {
  int64 envId = 1;
  int64 appId = 2;
  int64 artifactId = 3;
}

// ----------------------
// Titan gRPC Service
// ----------------------
service titan {
  rpc Ping(PingReq) returns (PingResp);

  // 集成凭证
  rpc ListIntegrations(ListIntegrationsReq) returns (ListIntegrationsResp);
  rpc CreateIntegration(CreateIntegrationReq) returns (CreateIntegrationResp);
  rpc UpdateIntegration(UpdateIntegrationReq) returns (CommonResp);
  rpc DeleteIntegration(DeleteIntegrationReq) returns (CommonResp);
  rpc TestIntegration(TestIntegrationReq) returns (TestIntegrationResp);

  // K8s 集群
  rpc ListClusters(ListClustersReq) returns (ListClustersResp);
  rpc CreateCluster(CreateClusterReq) returns (CreateClusterResp);
  rpc UpdateCluster(UpdateClusterReq) returns (CommonResp);
  rpc DeleteCluster(DeleteClusterReq) returns (CommonResp);
  rpc TestCluster(TestClusterReq) returns (TestClusterResp);
  rpc ListNamespaces(ListNamespacesReq) returns (ListNamespacesResp);

  // 流水线定义
  rpc ListPipelines(ListPipelinesReq) returns (ListPipelinesResp);
  rpc GetPipeline(GetPipelineReq) returns (PipelineDetailResp);
  rpc CreatePipeline(CreatePipelineReq) returns (CreatePipelineResp);
  rpc UpdatePipeline(UpdatePipelineReq) returns (CommonResp);
  rpc DeletePipeline(DeletePipelineReq) returns (CommonResp);

  // 执行与步骤控制
  rpc TriggerPipeline(TriggerPipelineReq) returns (TriggerPipelineResp);
  rpc ListExecutions(ListExecutionsReq) returns (ListExecutionsResp);
  rpc GetExecutionDetail(GetExecutionDetailReq) returns (ExecutionDetailResp);
  rpc GetStepLog(GetStepLogReq) returns (GetStepLogResp);
  rpc ApproveStep(ApproveStepReq) returns (CommonResp);
  rpc CancelExecution(CancelExecutionReq) returns (CommonResp);

  // ----------------------
  // Zadig CI/CD 演进服务
  // ----------------------
  // 1. 项目 (Project)
  rpc ListProjects(ListProjectsReq) returns (ListProjectsResp);
  rpc GetProject(GetProjectReq) returns (ProjectDetailResp);
  rpc CreateProject(CreateProjectReq) returns (CreateProjectResp);
  rpc UpdateProject(UpdateProjectReq) returns (CommonResp);
  rpc DeleteProject(DeleteProjectReq) returns (CommonResp);

  // 2. 应用 (Application)
  rpc ListApps(ListAppsReq) returns (ListAppsResp);
  rpc GetApp(GetAppReq) returns (AppDetailResp);
  rpc CreateApp(CreateAppReq) returns (CreateAppResp);
  rpc UpdateApp(UpdateAppReq) returns (CommonResp);
  rpc DeleteApp(DeleteAppReq) returns (CommonResp);

  // 3. 环境 (Environment)
  rpc ListEnvs(ListEnvsReq) returns (ListEnvsResp);
  rpc GetEnv(GetEnvReq) returns (EnvDetailResp);
  rpc CreateEnv(CreateEnvReq) returns (CreateEnvResp);
  rpc UpdateEnv(UpdateEnvReq) returns (CommonResp);
  rpc DeleteEnv(DeleteEnvReq) returns (CommonResp);
  rpc GetEnvLiveDetail(GetEnvLiveDetailReq) returns (GetEnvLiveDetailResp);

  // 4. 制品 (Artifact)
  rpc ListArtifacts(ListArtifactsReq) returns (ListArtifactsResp);
  rpc CreateArtifact(CreateArtifactReq) returns (CreateArtifactResp);
  rpc DeployArtifact(DeployArtifactReq) returns (CommonResp);
}
