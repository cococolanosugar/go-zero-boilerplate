syntax = "proto3";

package user;
option go_package = "./pb";

message IdRequest {
  int64 id = 1;
}

message UserInfoResponse {
  int64 id = 1;
  string name = 2;
  string mobile = 3;
  string avatar = 4;
}

message RegisterRequest {
  string username = 1;
  string mobile = 2;
  string password = 3;
}

message RegisterResponse {
  int64 id = 1;
}

message LoginRequest {
  string mobile = 1;
  string password = 2;
}

message LoginResponse {
  int64 id = 1;
  string token = 2;
  int64 expire = 3;
}

service User {
  rpc GetUserInfo(IdRequest) returns (UserInfoResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
}
