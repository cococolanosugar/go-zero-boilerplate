syntax = "proto3";

package user;
option go_package = "./pb";

message EmptyRequest {}
message EmptyResponse {}

message IdRequest {
  int64 id = 1;
}

message UserInfoResponse {
  int64 id = 1;
  string name = 2;
  string mobile = 3;
  string avatar = 4;
}

message RegisterRequest {
  string username = 1;
  string mobile = 2;
  string password = 3;
}

message RegisterResponse {
  int64 id = 1;
}

message LoginRequest {
  string mobile = 1;
  string password = 2;
}

message LoginResponse {
  int64 id = 1;
  string token = 2;
  int64 expire = 3;
}

// -------------------------------------------------------------
// 系统与权限管理协议 (RBAC & Permissions)
// -------------------------------------------------------------

message AdminLoginRequest {
  string account = 1; // 允许使用用户名或手机号
  string password = 2;
}

message AdminLoginResponse {
  int64 id = 1;
  string username = 2;
  string realName = 3;
  string avatar = 4;
  repeated string roles = 5;
}

message SyncCasdoorUserRequest {
  string casdoorSub = 1;
  string username = 2;
  string email = 3;
  string mobile = 4;
  string realName = 5;
  string avatar = 6;
}

message SyncCasdoorUserResponse {
  int64 id = 1;
  string username = 2;
  string realName = 3;
  string avatar = 4;
  repeated string roles = 5;
}

message AdminProfileResponse {
  int64 id = 1;
  string username = 2;
  string realName = 3;
  string mobile = 4;
  string email = 5;
  string avatar = 6;
  string deptName = 7;
  repeated string roles = 8;
  repeated string permissions = 9; // 按钮权限编码列表 (如 system:user:add)
  repeated MenuItem menus = 10;     // 动态菜单树 (仅包含目录与页面菜单)
}

message MenuItem {
  int64 id = 1;
  int64 parentId = 2;
  string title = 3;
  int32 type = 4; // 1:目录 2:菜单 3:按钮
  string path = 5;
  string component = 6;
  string permissionCode = 7;
  string icon = 8;
  int32 sort = 9;
  repeated MenuItem children = 10;
}

message SysUserItem {
  int64 id = 1;
  int64 deptId = 2;
  string deptName = 3;
  string username = 4;
  string realName = 5;
  string mobile = 6;
  string email = 7;
  string avatar = 8;
  int32 status = 9;
  repeated string roleNames = 10;
  repeated int64 roleIds = 11;
  string createTime = 12;
}

message ListSysUsersRequest {
  int32 page = 1;
  int32 pageSize = 2;
  string keyword = 3;
  int64 deptId = 4;
}

message ListSysUsersResponse {
  int64 total = 1;
  repeated SysUserItem list = 2;
}

message CreateSysUserRequest {
  int64 deptId = 1;
  string username = 2;
  string password = 3;
  string realName = 4;
  string mobile = 5;
  string email = 6;
  repeated int64 roleIds = 7;
}

message UpdateSysUserRequest {
  int64 id = 1;
  int64 deptId = 2;
  string realName = 3;
  string mobile = 4;
  string email = 5;
  int32 status = 6;
  repeated int64 roleIds = 7;
}

message SysRoleItem {
  int64 id = 1;
  string name = 2;
  string code = 3;
  int32 sort = 4;
  int32 dataScope = 5;
  int32 status = 6;
  string description = 7;
  repeated int64 menuIds = 8;
  string createTime = 9;
}

message ListSysRolesRequest {
  int32 page = 1;
  int32 pageSize = 2;
  string keyword = 3;
}

message ListSysRolesResponse {
  int64 total = 1;
  repeated SysRoleItem list = 2;
}

message CreateSysRoleRequest {
  string name = 1;
  string code = 2;
  int32 sort = 3;
  int32 dataScope = 4;
  string description = 5;
}

message UpdateSysRoleRequest {
  int64 id = 1;
  string name = 2;
  string code = 3;
  int32 sort = 4;
  int32 dataScope = 5;
  string description = 6;
  int32 status = 7;
}

message AssignRolePermRequest {
  int64 roleId = 1;
  repeated int64 menuIds = 2; // 勾选的菜单与按钮ID
}

message GetSysMenuTreeResponse {
  repeated MenuItem list = 1;
}

message SysApiItem {
  int64 id = 1;
  string apiGroup = 2;
  string title = 3;
  string path = 4;
  string method = 5;
  int32 isAutoSync = 6;
}

message ListSysApisResponse {
  repeated SysApiItem list = 1;
}

// -------------------------------------------------------------
// 数据字典 (Data Dictionary)
// -------------------------------------------------------------

message SysDictTypeItem {
  int64 id = 1;
  string dictName = 2;
  string dictType = 3;
  int32 status = 4;
  string remark = 5;
  string createTime = 6;
}

message ListSysDictTypesRequest {
  int32 page = 1;
  int32 pageSize = 2;
  string keyword = 3;
  int32 status = 4;
}

message ListSysDictTypesResponse {
  int64 total = 1;
  repeated SysDictTypeItem list = 2;
}

message CreateSysDictTypeRequest {
  string dictName = 1;
  string dictType = 2;
  int32 status = 3;
  string remark = 4;
}

message UpdateSysDictTypeRequest {
  int64 id = 1;
  string dictName = 2;
  string dictType = 3;
  int32 status = 4;
  string remark = 5;
}

message SysDictDataItem {
  int64 id = 1;
  string dictType = 2;
  string dictLabel = 3;
  string dictValue = 4;
  int32 dictSort = 5;
  string listClass = 6;
  int32 isDefault = 7;
  int32 status = 8;
  string remark = 9;
  string createTime = 10;
}

message ListSysDictDataRequest {
  int32 page = 1;
  int32 pageSize = 2;
  string dictType = 3;
  string keyword = 4;
  int32 status = 5;
}

message ListSysDictDataResponse {
  int64 total = 1;
  repeated SysDictDataItem list = 2;
}

message CreateSysDictDataRequest {
  string dictType = 1;
  string dictLabel = 2;
  string dictValue = 3;
  int32 dictSort = 4;
  string listClass = 5;
  int32 isDefault = 6;
  int32 status = 7;
  string remark = 8;
}

message UpdateSysDictDataRequest {
  int64 id = 1;
  string dictType = 2;
  string dictLabel = 3;
  string dictValue = 4;
  int32 dictSort = 5;
  string listClass = 6;
  int32 isDefault = 7;
  int32 status = 8;
  string remark = 9;
}

message GetDictDataByTypeRequest {
  string dictType = 1;
}

message GetDictDataByTypeResponse {
  repeated SysDictDataItem list = 1;
}

// -------------------------------------------------------------
// 网关 RBAC 鉴权与审计日志 (RBAC Enforcement & Audit Logs)
// -------------------------------------------------------------

message CheckApiPermissionRequest {
  int64 userId = 1;
  string path = 2;
  string method = 3;
}

message CheckApiPermissionResponse {
  bool allowed = 1;
}

message RecordOperLogRequest {
  string title = 1;
  string operName = 2;
  string operUrl = 3;
  string operMethod = 4;
  string operIp = 5;
  int32 status = 6;
  string errorMsg = 7;
  int64 costTime = 8;
}

message RecordLoginLogRequest {
  string username = 1;
  string loginIp = 2;
  string browser = 3;
  string os = 4;
  int32 status = 5;
  string msg = 6;
}

message SysOperLogItem {
  int64 id = 1;
  string title = 2;
  string operName = 3;
  string operUrl = 4;
  string operMethod = 5;
  string operIp = 6;
  int32 status = 7;
  string errorMsg = 8;
  int64 costTime = 9;
  string createTime = 10;
}

message ListSysOperLogsRequest {
  int32 page = 1;
  int32 pageSize = 2;
  string operName = 3;
  string title = 4;
  int32 status = 5;
}

message ListSysOperLogsResponse {
  int64 total = 1;
  repeated SysOperLogItem list = 2;
}

message SysLoginLogItem {
  int64 id = 1;
  string username = 2;
  string loginIp = 3;
  string browser = 4;
  string os = 5;
  int32 status = 6;
  string msg = 7;
  string loginTime = 8;
}

message ListSysLoginLogsRequest {
  int32 page = 1;
  int32 pageSize = 2;
  string username = 3;
  int32 status = 4;
}

message ListSysLoginLogsResponse {
  int64 total = 1;
  repeated SysLoginLogItem list = 2;
}

service User {
  // 原有业务接口
  rpc GetUserInfo(IdRequest) returns (UserInfoResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);

  // 系统管理与 RBAC 权限接口
  rpc AdminLogin(AdminLoginRequest) returns (AdminLoginResponse);
  rpc SyncOrCreateCasdoorUser(SyncCasdoorUserRequest) returns (SyncCasdoorUserResponse);
  rpc GetAdminProfile(IdRequest) returns (AdminProfileResponse);
  
  // 员工管理
  rpc ListSysUsers(ListSysUsersRequest) returns (ListSysUsersResponse);
  rpc CreateSysUser(CreateSysUserRequest) returns (IdRequest);
  rpc UpdateSysUser(UpdateSysUserRequest) returns (EmptyResponse);
  rpc DeleteSysUser(IdRequest) returns (EmptyResponse);

  // 角色管理
  rpc ListSysRoles(ListSysRolesRequest) returns (ListSysRolesResponse);
  rpc CreateSysRole(CreateSysRoleRequest) returns (IdRequest);
  rpc UpdateSysRole(UpdateSysRoleRequest) returns (EmptyResponse);
  rpc DeleteSysRole(IdRequest) returns (EmptyResponse);
  rpc AssignRolePermissions(AssignRolePermRequest) returns (EmptyResponse);

  // 菜单与接口字典
  rpc GetSysMenuTree(EmptyRequest) returns (GetSysMenuTreeResponse);
  rpc ListSysApis(EmptyRequest) returns (ListSysApisResponse);

  // 数据字典管理
  rpc ListSysDictTypes(ListSysDictTypesRequest) returns (ListSysDictTypesResponse);
  rpc CreateSysDictType(CreateSysDictTypeRequest) returns (IdRequest);
  rpc UpdateSysDictType(UpdateSysDictTypeRequest) returns (EmptyResponse);
  rpc DeleteSysDictType(IdRequest) returns (EmptyResponse);

  rpc ListSysDictData(ListSysDictDataRequest) returns (ListSysDictDataResponse);
  rpc CreateSysDictData(CreateSysDictDataRequest) returns (IdRequest);
  rpc UpdateSysDictData(UpdateSysDictDataRequest) returns (EmptyResponse);
  rpc DeleteSysDictData(IdRequest) returns (EmptyResponse);
  rpc GetDictDataByType(GetDictDataByTypeRequest) returns (GetDictDataByTypeResponse);

  // 网关 RBAC 接口动态拦截鉴权
  rpc CheckApiPermission(CheckApiPermissionRequest) returns (CheckApiPermissionResponse);

  // 审计日志管理
  rpc RecordOperLog(RecordOperLogRequest) returns (EmptyResponse);
  rpc RecordLoginLog(RecordLoginLogRequest) returns (EmptyResponse);
  rpc ListSysOperLogs(ListSysOperLogsRequest) returns (ListSysOperLogsResponse);
  rpc ListSysLoginLogs(ListSysLoginLogsRequest) returns (ListSysLoginLogsResponse);
  // 岗位信息表
  rpc ListSysPosts(ListSysPostRequest) returns (ListSysPostResponse);
  rpc GetSysPost(IdRequest) returns (SysPostItem);
  rpc CreateSysPost(CreateSysPostRequest) returns (IdRequest);
  rpc UpdateSysPost(UpdateSysPostRequest) returns (EmptyResponse);
  rpc DeleteSysPost(IdRequest) returns (EmptyResponse);
  // 通知公告表
  rpc ListSysNotices(ListSysNoticeRequest) returns (ListSysNoticeResponse);
  rpc GetSysNotice(IdRequest) returns (SysNoticeItem);
  rpc CreateSysNotice(CreateSysNoticeRequest) returns (IdRequest);
  rpc UpdateSysNotice(UpdateSysNoticeRequest) returns (EmptyResponse);
  rpc DeleteSysNotice(IdRequest) returns (EmptyResponse);

  // 员工通知中心
  rpc GetMyNoticeFeed(GetMyNoticeFeedRequest) returns (GetMyNoticeFeedResponse);
  rpc MarkNoticeRead(MarkNoticeReadRequest) returns (EmptyResponse);
  rpc MarkAllNoticesRead(MarkAllNoticesReadRequest) returns (EmptyResponse);
}

// =============================================================
// 岗位信息表 (sys_post)
// =============================================================

message SysPostItem {
  int64 id = 1; // 岗位ID
  string post_code = 2; // 岗位编码
  string post_name = 3; // 岗位名称
  int64 post_sort = 4; // 显示顺序
  int64 status = 5; // 状态（1正常 0停用）
  string remark = 6; // 备注
  string create_time = 7; // 创建时间
  string update_time = 8; // 更新时间
}

message ListSysPostRequest {
  int64 page = 1;
  int64 pageSize = 2;
  string keyword = 3;
}

message ListSysPostResponse {
  int64 total = 1;
  repeated SysPostItem list = 2;
}

message CreateSysPostRequest {
  string post_code = 1; // 岗位编码
  string post_name = 2; // 岗位名称
  int64 post_sort = 3; // 显示顺序
  int64 status = 4; // 状态（1正常 0停用）
  string remark = 5; // 备注
}

message UpdateSysPostRequest {
  int64 id = 1; // 岗位ID
  string post_code = 2; // 岗位编码
  string post_name = 3; // 岗位名称
  int64 post_sort = 4; // 显示顺序
  int64 status = 5; // 状态（1正常 0停用）
  string remark = 6; // 备注
}

// =============================================================
// 通知公告表 (sys_notice)
// =============================================================

message SysNoticeItem {
  int64 id = 1; // 公告ID
  string notice_title = 2; // 公告标题
  int64 notice_type = 3; // 公告类型（1通知 2消息 3待办）
  string notice_content = 4; // 公告内容
  int64 status = 5; // 公告状态（1正常 0关闭）
  string create_by = 6; // 创建者
  string remark = 7; // 备注
  string create_time = 8; // 创建时间
  string update_time = 9; // 更新时间
}

message ListSysNoticeRequest {
  int64 page = 1;
  int64 pageSize = 2;
  string keyword = 3;
}

message ListSysNoticeResponse {
  int64 total = 1;
  repeated SysNoticeItem list = 2;
}

message CreateSysNoticeRequest {
  string notice_title = 1; // 公告标题
  int64 notice_type = 2; // 公告类型（1通知 2消息 3待办）
  string notice_content = 3; // 公告内容
  int64 status = 4; // 公告状态（1正常 0关闭）
  string create_by = 5; // 创建者
  string remark = 6; // 备注
}

message UpdateSysNoticeRequest {
  int64 id = 1; // 公告ID
  string notice_title = 2; // 公告标题
  int64 notice_type = 3; // 公告类型（1通知 2消息 3待办）
  string notice_content = 4; // 公告内容
  int64 status = 5; // 公告状态（1正常 0关闭）
  string create_by = 6; // 创建者
  string remark = 7; // 备注
}

// 员工端通知流消息
message NoticeFeedItem {
  int64 id = 1;
  string notice_title = 2;
  int64 notice_type = 3;
  string notice_content = 4;
  int64 status = 5;
  string create_by = 6;
  string remark = 7;
  string create_time = 8;
  string update_time = 9;
  bool is_read = 10;
}

message GetMyNoticeFeedRequest {
  int64 user_id = 1;
  int64 limit = 2;
}

message GetMyNoticeFeedResponse {
  int64 total_unread = 1;
  repeated NoticeFeedItem list = 2;
}

message MarkNoticeReadRequest {
  int64 user_id = 1;
  int64 notice_id = 2;
}

message MarkAllNoticesReadRequest {
  int64 user_id = 1;
  int64 notice_type = 2; // 0 表示全部分类
}
