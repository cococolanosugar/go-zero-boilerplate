Name: gateway
Host: ${GATEWAY_HOST:0.0.0.0}
Port: ${GATEWAY_PORT:8888}

# JWT 鉴权配置
Auth:
  AccessSecret: ${JWT_SECRET:go-zero-boilerplate-secret-key-2026}
  AccessExpire: ${JWT_EXPIRE:86400}

# ================= 下游微服务客户端连接配置 =================

# 用户微服务 gRPC 客户端
UserRpc:
  # 模式一：Nacos 服务发现（当前默认启用）
  Target: nacos://${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}/user.rpc?namespaceid=${NACOS_NAMESPACE:public}&timeout=5000s
  NonBlock: true
  # 模式二：Etcd 服务发现（切换至 Etcd 时：注释上方 Target，解开下方注释）
  # Etcd:
  #   Hosts:
  #     - ${ETCD_HOST:127.0.0.1:2379}
  #   Key: user.rpc
  # 模式三：直连模式（单机调试或无注册中心时：注释上方 Target 和 Etcd，解开下方注释）
  # Endpoints:
  #   - ${USER_RPC_HOST:127.0.0.1:8080}

# 订单微服务 gRPC 客户端
OrderRpc:
  # 模式一：Nacos 服务发现（当前默认启用）
  Target: nacos://${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}/order.rpc?namespaceid=${NACOS_NAMESPACE:public}&timeout=5000s
  NonBlock: true
  # 模式二：Etcd 服务发现（切换至 Etcd 时：注释上方 Target，解开下方注释）
  # Etcd:
  #   Hosts:
  #     - ${ETCD_HOST:127.0.0.1:2379}
  #   Key: order.rpc
  # 模式三：直连模式（单机调试或无注册中心时：注释上方 Target 和 Etcd，解开下方注释）
  # Endpoints:
  #   - ${ORDER_RPC_HOST:127.0.0.1:8081}

