Name: gateway
Host: 0.0.0.0
Port: 8888

# JWT 鉴权配置
Auth:
  AccessSecret: go-zero-boilerplate-secret-key-2026
  AccessExpire: 86400

# ================= 下游微服务客户端连接配置 =================

# 用户微服务 gRPC 客户端
UserRpc:
  # 模式一：Nacos 服务发现
  # Target: nacos://127.0.0.1:8848/user.rpc?namespaceid=public&timeout=5000s
  # NonBlock: true
  # 模式二：Etcd 服务发现
  # Etcd:
  #   Hosts:
  #     - 127.0.0.1:2379
  #   Key: user.rpc
  # 模式三：直连模式（当前单机极速调试启用，无需注册中心容器）
  Endpoints:
    - 127.0.0.1:8080
  NonBlock: true

# 订单微服务 gRPC 客户端
OrderRpc:
  # 模式一：Nacos 服务发现
  # Target: nacos://127.0.0.1:8848/order.rpc?namespaceid=public&timeout=5000s
  # NonBlock: true
  # 模式二：Etcd 服务发现
  # Etcd:
  #   Hosts:
  #     - 127.0.0.1:2379
  #   Key: order.rpc
  # 模式三：直连模式（当前单机极速调试启用，无需注册中心容器）
  Endpoints:
    - 127.0.0.1:8081
  NonBlock: true

# ================= Casdoor SSO 认证配置 =================
Casdoor:
  Endpoint: http://127.0.0.1:8000
