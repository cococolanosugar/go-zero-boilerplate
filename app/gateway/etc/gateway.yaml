Name: gateway
Host: 0.0.0.0
Port: 8888

# JWT 鉴权配置
Auth:
  AccessSecret: go-zero-boilerplate-secret-key-2026
  AccessExpire: 86400

# Redis 缓存配置 (用于在线会话与 Token 黑名单)
Redis:
  Host: 127.0.0.1:6379
  Type: node

# ================= 下游微服务客户端连接配置 =================

# 用户微服务 gRPC 客户端
UserRpc:
  # 模式一：Nacos 服务发现
  # Target: nacos://127.0.0.1:8848/user.rpc?namespaceid=public&timeout=5000s
  # NonBlock: true
  # 模式二：Etcd 服务发现
  # Etcd:
  #   Hosts:
  #     - 127.0.0.1:2379
  #   Key: user.rpc
  # 模式三：直连模式（当前单机极速调试启用，无需注册中心容器）
  Endpoints:
    - 127.0.0.1:8080
  NonBlock: true

# Worker 任务执行微服务 gRPC 客户端 (端口 8082)
WorkerRpc:
  Endpoints:
    - 127.0.0.1:8082
  NonBlock: true

# ================= Casdoor SSO 认证配置 =================
Casdoor:
  Endpoint: http://127.0.0.1:8000
  ClientId: d795c3b1a7b960bd0b61
  ClientSecret: 2cc190e9c43e9659f45ad233cf0bec3038f59b46
  Certificate: ""
  OrganizationName: built-in
  ApplicationName: app-built-in

# ================= 对象存储配置 =================
Storage:
  Driver: local
  BasePath: ./data/uploads
  BaseUrl: /uploads

# ================= Temporal 分布式工作流配置 =================
Temporal:
  HostPort: 127.0.0.1:7233
  Namespace: default

  MaxSize: 20971520 # 20MB
