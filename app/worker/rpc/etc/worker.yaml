Name: worker.rpc
ListenOn: ${WORKER_RPC_LISTEN_ON:0.0.0.0:8082}

# 数据库持久层配置
DataSource: ${MYSQL_DSN:root:root@tcp(127.0.0.1:3306)/go_zero_boilerplate?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai}

# Redis 缓存集群配置
Cache:
  - Host: ${REDIS_HOST:127.0.0.1:6379}

Temporal:
  HostPort: ${TEMPORAL_HOST:127.0.0.1:7233}
  Namespace: ${TEMPORAL_NAMESPACE:default}
  TaskQueue: ${TEMPORAL_TASK_QUEUE:ASYNC_TASK_QUEUE}

