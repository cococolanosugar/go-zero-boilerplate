name: Continuous Integration

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  backend:
    name: Backend Test & Build (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Unit Tests
        run: go test -v -race -coverprofile=coverage.out ./pkg/...

      - name: Compile All Services
        run: go build -v ./app/...

  frontend:
    name: Frontend Lint & Build (Ant Design & Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Ant Design Specification & Deprecation Lint
        working-directory: frontend
        run: |
          npx @ant-design/cli lint ./apps/admin/src
          npx @ant-design/cli lint ./apps/portal/src

      - name: Build All Frontend Apps
        working-directory: frontend
        run: pnpm build
